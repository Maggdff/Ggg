name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-core:
    name: اختبار نواة القياس على الفيديو الحقيقي
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: أدوات الاختبار
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install numpy "opencv-python-headless<5"
          curl -sL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip
      - name: تشغيل الاختبارات
        run: bash verify/run.sh testdata/meter.mp4 "$PWD/kotlinc/bin/kotlinc"

  build:
    name: بناء APK
    needs: verify-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4

      - name: بناء Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SmartWaterMonitor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
