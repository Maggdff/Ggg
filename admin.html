<!doctype html><html lang=ar dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content="noindex,nofollow"><title>لوحة الإدارة</title>
<style>
:root{--bg:#f2f3f1;--card:#fff;--ink:#1a1c1f;--mut:#5d636b;--line:#c9ccd0;--acc:#1d4e89;--ok:#1b7f3b;--bad:#c2231f;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#101214;--card:#1a1d20;--ink:#e9eae8;--mut:#a6adb6;--line:#3a4046;--acc:#8fb8ee;--ok:#5fd07f;--bad:#ff7b73;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:10px}
input,textarea,select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;font:inherit}
textarea.code,input.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;direction:ltr;text-align:left;white-space:pre}
label{display:block;margin:8px 0 2px;color:var(--mut);font-size:14px}
button{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
button.p{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}button.danger{color:var(--bad)}
.tb{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details.q{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;padding:0 12px}
details.q>summary{cursor:pointer;padding:12px 0;font-weight:600}.pv{color:var(--mut);font:12px ui-monospace,monospace;direction:ltr;display:inline-block;margin-inline-start:8px}
details.q[open]{padding-bottom:12px}.op{display:flex;gap:8px;align-items:flex-start;margin-top:6px}.op input[type=radio]{width:22px;height:22px;margin-top:10px;flex:none}.op b{margin-top:8px;width:18px;flex:none}
.bar{display:flex;gap:8px;margin-top:12px}.hid{display:none!important}.msg{color:var(--mut);font-size:14px}.err{color:var(--bad)}.ok{color:var(--ok)}
</style></head><body><main>
<div id=lg class=box style="max-width:380px;margin:12vh auto"><h2 style="margin-top:0">دخول المشرف</h2>
<label>كلمة المرور<input id=pw type=password autocomplete=current-password></label>
<p id=le class="msg err"></p><button class=p id=lb style="width:100%">دخول</button></div>
<div id=ap hidden>
<div class=tb><button class=p id=sv>حفظ ونشر</button><button id=ad>+ سؤال جديد</button><button id=ex>تصدير</button><button id=im>استيراد</button><button id=rs class=danger>استعادة الأصلية</button><button id=lo>خروج</button>
<input id=sq placeholder="بحث..." style="flex:1;min-width:120px"><input id=fi type=file accept=".json" hidden></div>
<p class=msg><span id=src></span> — <span id=cnt></span> <span id=st></span></p>
<div id=list></div></div></main>
<script>
const $=s=>document.querySelector(s);let L=[],pw=sessionStorage.getItem("pw")||"",dirty=false,open=new Set();
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
async function api(b){let r;try{r=await fetch("/api/questions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw,...b})})}catch(e){return{ok:false,status:0,d:{error:"تعذر الوصول للخادم: تأكد من فتح الصفحة من رابط Vercel وليس من ملف على جهازك"}}}let d={};try{d=await r.json()}catch(e){}if(!r.ok&&!d.error)d.error=r.status==404?"الخادم غير موجود (404): ملف api/questions.js غير منشور. تأكد أنه داخل مجلد api في جذر المستودع ثم أعد النشر":"خطأ من الخادم ("+r.status+")";return{ok:r.ok,status:r.status,d}}
async function login(p){pw=p;const r=await api({action:"login"});if(!r.ok){pw="";sessionStorage.removeItem("pw");$("#le").textContent=r.d.error||"تعذر الاتصال";return}
sessionStorage.setItem("pw",pw);$("#lg").hidden=true;$("#ap").hidden=false;await load()}
async function load(){let d=[];try{d=await(await fetch("/api/questions",{cache:"no-store"})).json()}catch(e){}
if(!Array.isArray(d)||!d.length){d=await(await fetch("/questions.json")).json();$("#src").textContent="الأسئلة الأصلية (لم يُنشر تعديل بعد)"}else $("#src").textContent="النسخة المنشورة";L=d;dirty=false;open=new Set();render()}
function card(q,i){return `<details class=q data-i=${i} ${open.has(i)?"open":""}><summary><b>${i+1}</b> ${esc(q.t.slice(-70))}<span class=pv>${esc((q.c||"").split("\n")[0].slice(0,40))}</span></summary>
<label>العنوان<input data-f=t value="${esc(q.t)}"></label><label>الكود (أو الشكل المطلوب)<textarea data-f=c rows=7 class=code>${esc(q.c)}</textarea></label>
<label>الخيارات — اختر الدائرة بجانب الإجابة الصحيحة</label>
${q.o.map((o,k)=>`<div class=op><input type=radio name=k${i} data-k=${k} ${q.k==k?"checked":""}><b>${"ABCD"[k]}</b><textarea data-o=${k} rows=2 class=code>${esc(o)}</textarea></div>`).join("")}
<label>التصحيح / الشرح الذي يظهر بعد الإجابة<textarea data-f=e rows=3>${esc(q.e)}</textarea></label>
<div class=bar><button data-a=up>↑</button><button data-a=dn>↓</button><button data-a=dup>نسخ</button><button data-a=del class=danger>حذف</button></div></details>`}
function render(){$("#list").innerHTML=L.map(card).join("");$("#cnt").textContent=L.length+" سؤال";mark();filt()}
function mark(){$("#st").textContent=dirty?"• تعديلات غير منشورة":"";$("#st").className=dirty?"err":""}
function filt(){const s=$("#sq").value.trim().toLowerCase();[...$("#list").children].forEach((e,i)=>e.classList.toggle("hid",!!s&&!(L[i].t+L[i].c+L[i].e).toLowerCase().includes(s)))}
const idx=e=>+e.target.closest(".q").dataset.i;
$("#list").addEventListener("input",e=>{const i=idx(e),d=e.target.dataset;if(d.f)L[i][d.f]=e.target.value;else if(d.o!=null)L[i].o[+d.o]=e.target.value;else return;dirty=true;mark()});
$("#list").addEventListener("change",e=>{if(e.target.dataset.k!=null){L[idx(e)].k=+e.target.dataset.k;dirty=true;mark()}});
$("#list").addEventListener("toggle",e=>{const i=+e.target.dataset.i;e.target.open?open.add(i):open.delete(i)},true);
$("#list").addEventListener("click",e=>{const a=e.target.dataset.a;if(!a)return;const i=idx(e);
if(a=="del"){if(!confirm("حذف السؤال "+(i+1)+"؟"))return;L.splice(i,1);open=new Set()}
else if(a=="dup"){L.splice(i+1,0,JSON.parse(JSON.stringify(L[i])));open=new Set([i+1])}
else{const j=a=="up"?i-1:i+1;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];open=new Set([j])}
dirty=true;render()});
$("#ad").onclick=()=>{L.unshift({t:"What is the output? · ما ناتج الكود؟",c:"",o:["","","",""],k:0,e:""});open=new Set([0]);dirty=true;render();scrollTo(0,0)};
$("#sq").oninput=filt;
function check(){for(let i=0;i<L.length;i++){const q=L[i];let m="";if(!q.t.trim())m="العنوان فارغ";else if(!q.c.trim())m="الكود فارغ";else if(!q.o[q.k].trim())m="الإجابة الصحيحة فارغة";else if(new Set(q.o).size<q.o.length)m="يوجد خياران متطابقان";if(m){open=new Set([i]);render();$("#list").children[i].scrollIntoView();return"السؤال "+(i+1)+": "+m}}return""}
$("#sv").onclick=async()=>{const m=check();if(m){alert(m);return}$("#sv").disabled=true;const r=await api({action:"save",questions:L});$("#sv").disabled=false;
if(r.ok){dirty=false;mark();$("#src").textContent="النسخة المنشورة";alert("تم النشر ✓ ("+r.d.count+" سؤال)")}else alert(r.d.error||"فشل الحفظ")};
$("#rs").onclick=async()=>{if(!confirm("سيتم حذف النسخة المنشورة والعودة للأسئلة الأصلية. متأكد؟"))return;const r=await api({action:"reset"});if(r.ok)await load();else alert(r.d.error||"فشل")};
$("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(L,null,1)],{type:"application/json"}));a.download="questions.json";a.click()};
$("#im").onclick=()=>$("#fi").click();
$("#fi").onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d)||!d.every(q=>q&&typeof q.t=="string"&&typeof q.c=="string"&&typeof q.e=="string"&&Array.isArray(q.o)&&q.o.length>=2&&q.o.length<=4&&Number.isInteger(q.k)&&q.o[q.k]!=null))throw 0;L=d;open=new Set();dirty=true;render()}catch(x){alert("ملف غير صالح")}e.target.value=""};
$("#lo").onclick=()=>{sessionStorage.removeItem("pw");location.reload()};
$("#lb").onclick=()=>login($("#pw").value);$("#pw").onkeydown=e=>{if(e.key=="Enter")login(e.target.value)};
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
if(pw)login(pw);
</script></body></html>
